[package]
name = "ruxen_repl"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Declaring `links` lets downstream build scripts (e.g. ruxen_cli's,
# which links the unified `ruxen` binary) read this crate's published
# build-script metadata via `DEP_RUXENRT_*` env vars. We use it to
# share the absolute path of `libruxenrt.a` so the final binary's link
# command can `-force_load` it — cargo does not propagate
# `cargo:rustc-link-arg` across crate boundaries.
links = "ruxenrt"

[lib]
name = "ruxen_repl"
path = "src/lib.rs"

[dependencies]
ruxen_core = { path = "../../compiler/ruxen_core" }
cranelift-jit = { version = "0.130", features = ["selinux-fix"] }
cranelift-module = "0.130"
cranelift-codegen = "0.130"
cranelift-native = "0.130"
cranelift-frontend = "0.130"
rustyline = "15"
target-lexicon = "0.13"
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
# Integration tests spawn `ruxen repl` rather than a standalone REPL
# binary; the dep makes `CARGO_BIN_EXE_ruxen` available to them.
ruxen_cli = { path = "../ruxen_cli" }

[lints]
workspace = true
