[package]
name = "ruxen_cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ruxen_cli"
path = "src/lib.rs"

[[bin]]
name = "ruxen"
path = "src/main.rs"

[features]
# Propagate to `ruxenc` too: `ruxenc`'s compile path has its own
# `#[cfg(feature = "llvm")]` match arm for `Backend::Llvm`, so enabling the
# variant via `ruxen_core/llvm` without also enabling `ruxenc/llvm` would
# leave that arm cfg'd out and the match non-exhaustive (E0004).
llvm = ["ruxen_core/llvm", "ruxenc/llvm"]

[dependencies]
ruxen_core = { path = "../../compiler/ruxen_core" }
ruxenc = { path = "../ruxenc" }
ruxen_lsp = { path = "../ruxen_lsp" }
ruxen_repl = { path = "../ruxen_repl" }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ar = "0.9"

[dev-dependencies]
ruxen_core = { path = "../../compiler/ruxen_core" }
tempfile = "3"

[lints]
workspace = true
