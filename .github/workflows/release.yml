name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Run installed-binary tests (native only)
        # Skip on cross builds — we can't execute aarch64 binaries on an
        # x86_64 runner. Other native matrix entries cover the same code
        # paths (find_runtime_c, pkg-manager, REPL).
        if: matrix.cross != true
        shell: bash
        run: |
          cargo test --release --target ${{ matrix.target }} \
            -p ruxenc   --test installed_binary \
            -p ruxen_cli --test installed_pkg_manager \
            -p ruxen_repl --test installed_repl

      - name: Build release binary
        shell: bash
        run: |
          # One binary ships: `ruxen`. Building `-p ruxen_cli` transitively
          # builds ruxenc / ruxen_lsp / ruxen_repl as libraries (they no
          # longer produce their own bins; everything routes through
          # `ruxen <subcommand>`).
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin ruxen
          else
            cargo build --release --target ${{ matrix.target }} --bin ruxen
          fi

      - name: Stage artifacts
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          NAME="ruxen-${TAG}-${TARGET}"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}/bin"

          BIN_DIR="target/${TARGET}/release"
          cp "${BIN_DIR}/ruxen" "${STAGE}/bin/ruxen"
          chmod +x "${STAGE}/bin/ruxen"

          cp README.md LICENSE* "${STAGE}/" 2>/dev/null || true

          # Ship the prebuilt C runtime archive. The `ruxen_cli` build
          # script copies `libruxenrt.a` next to the binary at
          # target/${TARGET}/release/; install.sh maps the staged `lib/`
          # tree onto `<install>/lib/` verbatim, so an installed toolchain
          # links AOT binaries without recompiling the runtime `.c`.
          # (Replaces the pre-#06.95 `library/runtime/` copy, a path that
          # no longer exists — the real tree is `library/std/*/runtime/`.)
          mkdir -p "${STAGE}/lib"
          cp "target/${TARGET}/release/libruxenrt.a" "${STAGE}/lib/libruxenrt.a"

          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruxen-${{ matrix.target }}
          path: dist/ruxen-*.tar.gz*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Ruxen ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/ruxen-*.tar.gz
            dist/ruxen-*.tar.gz.sha256
            install.sh
