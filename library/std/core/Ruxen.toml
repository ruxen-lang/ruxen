[package]
name = "std-core"
version = "0.1.0"
description = "Ruxen stdlib core — primitive trait surface + low-level C runtime"

# `-lc` and `-lm` are linked into every Ruxen binary because every
# C runtime translation unit calls into libc (alloc / I/O / string)
# and the math runtime helpers (`ruxen_float_*` / interpolation
# float formatting / `ruxen_pow_int`) need libm. Moved here from
# `compiler/ruxen_core/src/codegen/object.rs::linker_args` by B3 of
# docs/specs/system/zero_rust_stdlib_classes.spec.md so future
# stdlib packages with new link-time dependencies (e.g. `-lssl`) can
# declare them in their own Ruxen.toml without compiler edits.
[system_libs]
libs = ["c", "m"]
