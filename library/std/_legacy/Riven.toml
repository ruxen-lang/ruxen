# Transitional wrapper package for #06.95 Phase A.
#
# Before Phase A, the stdlib was a flat collection of 18 `.rvn`
# files under `library/std/src/`. Phase A moves them under this
# `_legacy/` package directory so the bootstrap loader can be
# generalised to "discover packages under `library/std/`" without
# yet splitting the 18 files into 19 real packages (that's Phase B).
#
# This package is purely a transition artefact. It disappears in
# Phase B, replaced by per-module packages (`std-io`, `std-fs`,
# `std-net`, …) each owning its own `.rvn` surface + `runtime/*.c`
# implementation.

[package]
name = "std-legacy"
version = "0.1.0"
description = "Transitional wrapper for the pre-#06.95 stdlib layout. Replaced per-module in Phase B."

[dependencies]
