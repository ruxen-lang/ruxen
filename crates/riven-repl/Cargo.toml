[package]
name = "riven-repl"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "riven-repl"
path = "src/main.rs"

[dependencies]
riven-core = { path = "../riven-core" }
cranelift-jit = { version = "0.130", features = ["selinux-fix"] }
cranelift-module = "0.130"
cranelift-codegen = "0.130"
cranelift-native = "0.130"
cranelift-frontend = "0.130"
rustyline = "15"
target-lexicon = "0.13"

[build-dependencies]
cc = "1"

[lints]
workspace = true
